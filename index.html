<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1526">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>티커 브레이커 | 방구석월가</title>
<meta name="description" content="미국주식 티커 벽돌을 깨고 포트폴리오를 키우는 월스트리트 아케이드 게임">
<meta property="og:title" content="티커 브레이커 | 방구석월가">
<meta property="og:description" content="미국주식 티커 벽돌을 깨고 포트폴리오를 키워보세요.">
<meta property="og:image" content="bg.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="bg.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="hud">
    <div><span>포트폴리오</span> <b id="sc">$0</b></div>
    <span id="lv">라운드 1</span>
    <span id="li" aria-label="남은 목숨"><i>🐂</i><i>🐂</i><i>🐂</i></span>
  </header>

  <div id="co" aria-live="polite">
    <div id="lg" data-len="1">$</div>
    <div id="nm"><b id="cn">벽돌을 맞추면 기업 정보가 표시됩니다</b><span id="cs"></span></div>
    <em id="cp"></em>
  </div>

  <section id="wrap">
    <canvas id="c" aria-label="미국주식 티커 벽돌깨기 게임 화면"></canvas>
    <div id="ov">
      <h1>티커 브레이커</h1>
      <p class="sub">미국주식 티커를 깨고 포트폴리오를 키우세요</p>
      <div class="qr"><canvas id="qr" aria-label="게임 접속 QR 코드"></canvas></div>
      <p class="qrcap" id="qrcap">📱 QR을 스캔하면 내 휴대폰에서 바로 플레이</p>
      <button id="startBtn" class="btn" type="button">게임 시작</button>
      <small>손가락을 좌우로 움직여 공을 받아내세요</small>
    </div>
  </section>

  <div id="tape">벽돌을 깨면 체결 내역이 표시됩니다</div>
  <footer id="brand">방구석월가<i>|</i>미국주식 결을 읽다</footer>
</main>
<script src="script.js"></script>
</body>
</html>
